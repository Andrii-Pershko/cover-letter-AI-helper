name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/andrii-pershko/cover-letter-ai-helper

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Pull + restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /home/cover-letter-AI-helper

            git pull --ff-only

            pulled=0
            for i in 1 2 3; do
              if docker compose pull; then
                pulled=1
                break
              fi
              echo "docker compose pull failed (attempt $i/3), retrying..."
              sleep 10
            done
            if [ "$pulled" -ne 1 ]; then
              echo "docker compose pull failed after 3 attempts" >&2
              exit 1
            fi

            docker compose up -d --force-recreate migrate app

            for i in $(seq 1 15); do
              curl -sf http://localhost:3401/login > /dev/null && exit 0
              sleep 2
            done
            echo "App did not respond on :3401 after deploy" >&2
            docker compose logs --tail 100 app
            exit 1
