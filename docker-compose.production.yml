services:
  migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: aicl
      PGPASSWORD: aicl
      PGDATABASE: aicl
    volumes:
      - ./prisma/migrations:/migrations:ro
      - ./docker/apply-migrations.sh:/apply-migrations.sh:ro
    entrypoint: ["/bin/sh", "/apply-migrations.sh"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/andrii-pershko/cover-letter-ai-helper:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3401:3401"
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3401"
      DATABASE_URL: postgresql://aicl:aicl@db:5432/aicl?schema=public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
