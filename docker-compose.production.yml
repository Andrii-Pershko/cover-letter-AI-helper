services:
  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aicl:aicl@db:5432/aicl?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "3401:3401"
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3401"
      DATABASE_URL: postgresql://aicl:aicl@db:5432/aicl?schema=public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
