services:
  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    ports:
      - "3401:3401"
    env_file:
      - .env
    environment:
      APP_ENV: dev
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://aicl:aicl@db:5432/aicl?schema=public
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      # Весь проєкт з хоста, включно з .next у корені репозиторію.
      - .:/app
      # Linux node_modules з образу, щоб не змішувати з macOS.
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  app_node_modules:
